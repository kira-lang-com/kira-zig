name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  VERSION: "2026.07.2"
  BINARY_NAME: "kira"
  PRIMARY_EXECUTABLE: "kirac"

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Keep aligned with test.yml and llvm-metadata.toml.
        include:
          - os: linux
            arch: x64
            runner: ubuntu-24.04
            artifact_suffix: linux-x64
            archive_ext: tar.gz
          - os: macos
            arch: arm64
            runner: macos-14
            artifact_suffix: macos-arm64
            archive_ext: tar.gz
          - os: windows
            arch: x64
            runner: windows-2022
            artifact_suffix: windows-x64
            archive_ext: zip

    steps:
      - name: Check out Kira
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install native graphics headers (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxi-dev libxcursor-dev

      - name: Resolve LLVM CI metadata (Unix)
        if: ${{ matrix.os != 'windows' }}
        shell: pwsh
        env:
          KIRA_LLVM_GITHUB_REPOSITORY: kira-lang-com/kira
        run: |
          zig build fetch-llvm -- --ci-metadata --json | Out-File -FilePath "$env:RUNNER_TEMP/llvm-fetch.json" -Encoding utf8NoBOM
          $metadata = Get-Content "$env:RUNNER_TEMP/llvm-fetch.json" | ConvertFrom-Json
          "REPOSITORY=$($metadata.repository)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8NoBOM -Append
          "RELEASE_TAG=$($metadata.release_tag)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8NoBOM -Append
          "ASSET_NAME=$($metadata.asset_name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8NoBOM -Append
          "KIRA_LLVM_HOME=$($metadata.install_dir)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8NoBOM -Append

      - name: Resolve LLVM CI metadata (Windows)
        if: ${{ matrix.os == 'windows' }}
        shell: pwsh
        env:
          KIRA_LLVM_GITHUB_REPOSITORY: kira-lang-com/kira
        run: |
          zig build fetch-llvm -- --ci-metadata --json | Out-File -FilePath "$env:RUNNER_TEMP\llvm-fetch.json" -Encoding utf8NoBOM
          $metadata = Get-Content "$env:RUNNER_TEMP\llvm-fetch.json" | ConvertFrom-Json
          "REPOSITORY=$($metadata.repository)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8NoBOM -Append
          "RELEASE_TAG=$($metadata.release_tag)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8NoBOM -Append
          "ASSET_NAME=$($metadata.asset_name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8NoBOM -Append
          "KIRA_LLVM_HOME=$($metadata.install_dir)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8NoBOM -Append

      - name: Download pinned LLVM archive (Unix)
        if: ${{ matrix.os != 'windows' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/llvm-download"
          gh release download "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --pattern "$ASSET_NAME" \
            --dir "$RUNNER_TEMP/llvm-download"
          printf 'LLVM_ARCHIVE=%s\n' "$RUNNER_TEMP/llvm-download/$ASSET_NAME" >> "$GITHUB_ENV"

      - name: Download pinned LLVM archive (Windows)
        if: ${{ matrix.os == 'windows' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\llvm-download" | Out-Null
          gh release download "$env:RELEASE_TAG" `
            --repo "$env:REPOSITORY" `
            --pattern "$env:ASSET_NAME" `
            --dir "$env:RUNNER_TEMP\llvm-download"
          "LLVM_ARCHIVE=$env:RUNNER_TEMP\llvm-download\$env:ASSET_NAME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8NoBOM -Append

      - name: Resolve LibFFI CI metadata (Unix)
        if: ${{ matrix.os != 'windows' }}
        shell: pwsh
        env:
          KIRA_LLVM_GITHUB_REPOSITORY: kira-lang-com/kira
        run: |
          zig build fetch-libffi -- --ci-metadata --json | Out-File -FilePath "$env:RUNNER_TEMP/libffi-fetch.json" -Encoding utf8NoBOM
          $metadata = Get-Content "$env:RUNNER_TEMP/libffi-fetch.json" | ConvertFrom-Json
          "LIBFFI_REPOSITORY=$($metadata.repository)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8NoBOM -Append
          "LIBFFI_RELEASE_TAG=$($metadata.release_tag)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8NoBOM -Append
          "LIBFFI_ASSET_NAME=$($metadata.asset_name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8NoBOM -Append
          "KIRA_LIBFFI_HOME=$($metadata.install_dir)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8NoBOM -Append

      - name: Resolve LibFFI CI metadata (Windows)
        if: ${{ matrix.os == 'windows' }}
        shell: pwsh
        env:
          KIRA_LLVM_GITHUB_REPOSITORY: kira-lang-com/kira
        run: |
          zig build fetch-libffi -- --ci-metadata --json | Out-File -FilePath "$env:RUNNER_TEMP\libffi-fetch.json" -Encoding utf8NoBOM
          $metadata = Get-Content "$env:RUNNER_TEMP\libffi-fetch.json" | ConvertFrom-Json
          "LIBFFI_REPOSITORY=$($metadata.repository)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8NoBOM -Append
          "LIBFFI_RELEASE_TAG=$($metadata.release_tag)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8NoBOM -Append
          "LIBFFI_ASSET_NAME=$($metadata.asset_name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8NoBOM -Append
          "KIRA_LIBFFI_HOME=$($metadata.install_dir)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8NoBOM -Append

      - name: Install pinned LLVM archive (Unix)
        if: ${{ matrix.os != 'windows' }}
        env:
          KIRA_LLVM_GITHUB_REPOSITORY: kira-lang-com/kira
        run: |
          zig build fetch-llvm -- --archive "$LLVM_ARCHIVE"

      - name: Install pinned LLVM archive (Windows)
        if: ${{ matrix.os == 'windows' }}
        shell: pwsh
        run: |
          if (Test-Path $env:KIRA_LLVM_HOME) {
            Remove-Item $env:KIRA_LLVM_HOME -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $env:KIRA_LLVM_HOME | Out-Null
          & "$env:SystemRoot\System32\tar.exe" -xf "$env:LLVM_ARCHIVE" -C "$env:KIRA_LLVM_HOME"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path (Join-Path $env:KIRA_LLVM_HOME "bin\clang.exe"))) {
            throw "Extracted LLVM archive is missing bin\clang.exe under $env:KIRA_LLVM_HOME"
          }

      - name: Download pinned LibFFI archive (Unix)
        if: ${{ matrix.os != 'windows' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/libffi-download"
          gh release download "$LIBFFI_RELEASE_TAG" \
            --repo "$LIBFFI_REPOSITORY" \
            --pattern "$LIBFFI_ASSET_NAME" \
            --dir "$RUNNER_TEMP/libffi-download"
          printf 'LIBFFI_ARCHIVE=%s\n' "$RUNNER_TEMP/libffi-download/$LIBFFI_ASSET_NAME" >> "$GITHUB_ENV"

      - name: Download pinned LibFFI archive (Windows)
        if: ${{ matrix.os == 'windows' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\libffi-download" | Out-Null
          gh release download "$env:LIBFFI_RELEASE_TAG" `
            --repo "$env:LIBFFI_REPOSITORY" `
            --pattern "$env:LIBFFI_ASSET_NAME" `
            --dir "$env:RUNNER_TEMP\libffi-download"
          "LIBFFI_ARCHIVE=$env:RUNNER_TEMP\libffi-download\$env:LIBFFI_ASSET_NAME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8NoBOM -Append

      - name: Install pinned LibFFI archive (Unix)
        if: ${{ matrix.os != 'windows' }}
        run: |
          zig build fetch-libffi -- --archive "$LIBFFI_ARCHIVE"

      - name: Install pinned LibFFI archive (Windows)
        if: ${{ matrix.os == 'windows' }}
        shell: pwsh
        run: |
          zig build fetch-libffi -- --archive "$env:LIBFFI_ARCHIVE"

      - name: Clear Zig cache after LLVM install (Unix)
        if: ${{ matrix.os != 'windows' }}
        shell: bash
        run: |
          rm -rf .zig-cache
          if [ -n "${ZIG_LOCAL_CACHE_DIR:-}" ]; then
            rm -rf "$ZIG_LOCAL_CACHE_DIR"
            mkdir -p "$ZIG_LOCAL_CACHE_DIR"
          fi
          if [ -n "${ZIG_GLOBAL_CACHE_DIR:-}" ]; then
            rm -rf "$ZIG_GLOBAL_CACHE_DIR"
            mkdir -p "$ZIG_GLOBAL_CACHE_DIR"
          fi

      - name: Clear Zig cache after LLVM install (Windows)
        if: ${{ matrix.os == 'windows' }}
        shell: pwsh
        run: |
          if (Test-Path .zig-cache) {
            Remove-Item .zig-cache -Recurse -Force
          }
          if ($env:ZIG_LOCAL_CACHE_DIR -and (Test-Path $env:ZIG_LOCAL_CACHE_DIR)) {
            Remove-Item $env:ZIG_LOCAL_CACHE_DIR -Recurse -Force
          }
          if ($env:ZIG_LOCAL_CACHE_DIR) {
            New-Item -ItemType Directory -Force -Path $env:ZIG_LOCAL_CACHE_DIR | Out-Null
          }
          if ($env:ZIG_GLOBAL_CACHE_DIR -and (Test-Path $env:ZIG_GLOBAL_CACHE_DIR)) {
            Remove-Item $env:ZIG_GLOBAL_CACHE_DIR -Recurse -Force
          }
          if ($env:ZIG_GLOBAL_CACHE_DIR) {
            New-Item -ItemType Directory -Force -Path $env:ZIG_GLOBAL_CACHE_DIR | Out-Null
          }

      - name: Build Kira (Unix)
        if: matrix.os != 'windows'
        run: zig build -Doptimize=ReleaseSafe

      - name: Build Kira (Windows)
        if: matrix.os == 'windows'
        run: zig build -Doptimize=ReleaseSafe
        shell: pwsh

      - name: Package bootstrapper (Unix)
        id: package-bootstrapper
        if: matrix.os != 'windows'
        shell: bash
        run: |
          STAGE_DIR="${{ env.BINARY_NAME }}-${{ matrix.artifact_suffix }}"
          mkdir -p "$STAGE_DIR"

          cp "zig-out/bin/${{ env.BINARY_NAME }}" "$STAGE_DIR/${{ env.BINARY_NAME }}"
          chmod +x "$STAGE_DIR/${{ env.BINARY_NAME }}"

          cp README.md LICENSE llvm-metadata.toml "$STAGE_DIR/"

          ARCHIVE="${STAGE_DIR}.${{ matrix.archive_ext }}"
          tar -czf "$ARCHIVE" "$STAGE_DIR"
          echo "bootstrapper_archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Package toolchain (Unix)
        id: package-toolchain
        if: matrix.os != 'windows'
        shell: bash
        run: |
          TOOLCHAIN_DIR="$HOME/.kira/toolchains/release/${{ env.VERSION }}"
          ARCHIVE="kira-toolchain-${{ matrix.artifact_suffix }}.${{ matrix.archive_ext }}"
          tar -czf "$ARCHIVE" -C "$TOOLCHAIN_DIR" .
          echo "toolchain_archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Package bootstrapper (Windows)
        id: package-bootstrapper-win
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $stageDir = "${{ env.BINARY_NAME }}-${{ matrix.artifact_suffix }}"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

          Copy-Item "zig-out\bin\${{ env.BINARY_NAME }}.exe" -Destination "$stageDir\${{ env.BINARY_NAME }}.exe"

          Copy-Item README.md, LICENSE, llvm-metadata.toml -Destination "$stageDir\"

          $archive = "$stageDir.${{ matrix.archive_ext }}"
          Compress-Archive -Path $stageDir -DestinationPath $archive
          "bootstrapper_archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8NoBOM -Append

      - name: Package toolchain (Windows)
        id: package-toolchain-win
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $toolchainDir = Join-Path $HOME ".kira\toolchains\release\${{ env.VERSION }}"
          $archive = "kira-toolchain-${{ matrix.artifact_suffix }}.${{ matrix.archive_ext }}"
          Push-Location $toolchainDir
          Compress-Archive -Path "bin", "foundation", "templates", "llvm-metadata.toml" -DestinationPath (Join-Path $env:GITHUB_WORKSPACE $archive)
          Pop-Location
          "toolchain_archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8NoBOM -Append

      - name: Upload bootstrapper artifact
        uses: actions/upload-artifact@v4
        with:
          name: kira-bootstrapper-${{ matrix.artifact_suffix }}
          path: ${{ matrix.os == 'windows' && steps.package-bootstrapper-win.outputs.bootstrapper_archive || steps.package-bootstrapper.outputs.bootstrapper_archive }}
          if-no-files-found: error

      - name: Upload toolchain artifact
        uses: actions/upload-artifact@v4
        with:
          name: kira-toolchain-${{ matrix.artifact_suffix }}
          path: ${{ matrix.os == 'windows' && steps.package-toolchain-win.outputs.toolchain_archive || steps.package-toolchain.outputs.toolchain_archive }}
          if-no-files-found: error

  checksum:
    name: Generate checksums
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: kira-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum -b * > SHA256SUMS.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: artifacts/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build, checksum]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out Kira
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: kira-*
          merge-multiple: true

      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          name: checksums
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"

          # The matching CHANGELOG.md section (everything between this version's
          # heading and the next "## [" heading), captured before the header so the
          # empty-section fallback can actually trigger.
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { capture = 1; next }
            capture && index($0, "## [") == 1 { exit }
            capture { print }
          ' CHANGELOG.md > /tmp/section.md

          printf '## Kira %s\n\n' "$VERSION" > /tmp/notes.md
          if grep -q '[^[:space:]]' /tmp/section.md; then
            cat /tmp/section.md >> /tmp/notes.md
          else
            printf 'Kira %s release.\n' "$VERSION" >> /tmp/notes.md
          fi

          cat >> /tmp/notes.md << 'RELEASE_NOTES'

          ## Installation

          Download the `kira-<platform>` archive for your host, put `kira` on your
          `PATH`, and run it once to install the matching managed toolchain. Run
          `kira fetch-llvm` afterwards for LLVM/native and hybrid backends.

          ## Assets

          - `kira-<platform>` — bootstrapper launcher for each supported host
            (linux-x64, macos-arm64, windows-x64)
          - `kira-toolchain-<platform>` — managed toolchain archive fetched
            automatically by the launcher
          - `SHA256SUMS.txt` — checksums for every published asset

          ## Verification

          Verify the checksums with `sha256sum -c SHA256SUMS.txt`.
          RELEASE_NOTES

          printf '\n**Full changelog**: https://github.com/%s/blob/%s/CHANGELOG.md\n' \
            "$GH_REPO" "$TAG_NAME" >> /tmp/notes.md

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --title "Kira ${VERSION}" \
              --notes-file /tmp/notes.md
            gh release upload "$TAG_NAME" artifacts/* --clobber
          else
            gh release create "$TAG_NAME" \
              --title "Kira ${VERSION}" \
              --notes-file /tmp/notes.md \
              artifacts/*
          fi

      - name: Verify release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          expected=(
            kira-linux-x64.tar.gz
            kira-macos-arm64.tar.gz
            kira-windows-x64.zip
            kira-toolchain-linux-x64.tar.gz
            kira-toolchain-macos-arm64.tar.gz
            kira-toolchain-windows-x64.zip
            SHA256SUMS.txt
          )
          for asset in "${expected[@]}"; do
            if ! gh release view "$TAG_NAME" --json assets --jq '.assets[].name' | grep -qx "$asset"; then
              echo "Missing expected asset: $asset"
              exit 1
            fi
          done
          echo "All expected assets present"
